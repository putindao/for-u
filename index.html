<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hân</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;
            background:
                radial-gradient(
                    circle at center,
                    #17131a 0%,
                    #09090d 45%,
                    #030305 100%
                );

            display: flex;
            justify-content: center;
            align-items: center;

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            cursor: pointer;
        }

        /* =========================
           BACKGROUND
        ========================= */

        .background {
            position: fixed;
            inset: 0;

            pointer-events: none;

            background:
                radial-gradient(
                    circle,
                    rgba(255, 120, 150, 0.05),
                    transparent 35%
                );

            animation: backgroundPulse 4s ease-in-out infinite;
        }

        @keyframes backgroundPulse {

            0%,
            100% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }
        }


        /* =========================
           MAIN
        ========================= */

        .container {
            position: relative;

            width: min(80vw, 420px);
            height: min(80vw, 420px);

            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* =========================
           HEART
        ========================= */

        .heart-wrapper {
            position: relative;

            width: 280px;
            height: 280px;

            display: flex;
            justify-content: center;
            align-items: center;

            transition:
                transform 0.3s ease;
        }


        .heart {
            width: 100%;
            height: 100%;

            overflow: visible;

            animation:
                heartbeat 2.2s ease-in-out infinite;

            filter:
                drop-shadow(
                    0 0 8px
                    rgba(255, 130, 160, 0.25)
                );

            transition:
                filter 0.5s ease;
        }


        /*
        Khi hover / chạm
        */

        .heart-wrapper:hover .heart {
            filter:
                drop-shadow(
                    0 0 12px
                    rgba(255, 130, 160, 0.5)
                )
                drop-shadow(
                    0 0 35px
                    rgba(255, 130, 160, 0.15)
                );
        }


        /*
        Heartbeat
        */

        @keyframes heartbeat {

            0% {
                transform: scale(1);
            }

            8% {
                transform: scale(1.035);
            }

            16% {
                transform: scale(1);
            }

            24% {
                transform: scale(1.025);
            }

            32% {
                transform: scale(1);
            }

            100% {
                transform: scale(1);
            }
        }


        /* =========================
           HEART LINE
        ========================= */

        .heart-path {
            fill: none;

            stroke: rgba(
                255,
                170,
                190,
                0.8
            );

            stroke-width: 1.3;

            stroke-linecap: round;

            stroke-linejoin: round;

            /*
            tạo cảm giác nét vẽ
            */

            filter:
                drop-shadow(
                    0 0 5px
                    rgba(255, 100, 140, 0.3)
                );
        }


        /*
        vòng glow phía sau
        */

        .heart-glow {
            fill: rgba(
                255,
                100,
                140,
                0.025
            );

            stroke: none;
        }


        /* =========================
           NAME
        ========================= */

        .name {
            position: absolute;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            color: rgba(
                255,
                235,
                240,
                0.95
            );

            font-size: 38px;

            font-weight: 300;

            letter-spacing: 5px;

            text-shadow:
                0 0 10px
                rgba(255, 150, 180, 0.25),

                0 0 25px
                rgba(255, 100, 140, 0.12);

            user-select: none;

            transition:
                color 0.5s ease,
                text-shadow 0.5s ease;
        }


        .heart-wrapper:hover .name {

            color: white;

            text-shadow:
                0 0 10px
                rgba(255, 150, 180, 0.5),

                0 0 35px
                rgba(255, 100, 140, 0.25);
        }


        /* =========================
           PARTICLES
        ========================= */

        .particle {
            position: fixed;

            width: 4px;
            height: 4px;

            border-radius: 50%;

            background: #ffdce5;

            pointer-events: none;

            box-shadow:
                0 0 8px
                rgba(255, 160, 185, 0.8);

            animation:
                particleFly
                var(--duration)
                ease-out
                forwards;
        }


        @keyframes particleFly {

            0% {

                transform:
                    translate(0, 0)
                    scale(0.3);

                opacity: 0;

            }

            15% {

                opacity: 1;

                transform:
                    translate(
                        calc(var(--x) * 0.15),
                        calc(var(--y) * 0.15)
                    )
                    scale(1);

            }

            100% {

                transform:
                    translate(
                        var(--x),
                        var(--y)
                    )
                    scale(0);

                opacity: 0;

            }
        }


        /* =========================
           CLICK FLASH
        ========================= */

        .flash {

            position: fixed;

            left: 50%;
            top: 50%;

            width: 20px;
            height: 20px;

            border-radius: 50%;

            background:
                rgba(
                    255,
                    150,
                    180,
                    0.8
                );

            transform:
                translate(-50%, -50%)
                scale(0);

            pointer-events: none;

            animation:
                flash 0.8s ease-out
                forwards;
        }


        @keyframes flash {

            0% {

                opacity: 0.7;

                transform:
                    translate(-50%, -50%)
                    scale(0);

            }

            100% {

                opacity: 0;

                transform:
                    translate(-50%, -50%)
                    scale(18);

            }
        }


        /* =========================
           SMALL HINT
        ========================= */

        .hint {

            position: fixed;

            bottom: 35px;

            left: 50%;

            transform:
                translateX(-50%);

            color:
                rgba(255,255,255,0.25);

            font-size: 11px;

            letter-spacing: 3px;

            transition:
                opacity 1s ease;

            user-select: none;
        }


        .hint.hide {
            opacity: 0;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .heart-wrapper {

                width: 240px;
                height: 240px;

            }

            .name {

                font-size: 32px;

                letter-spacing: 4px;

            }

            .hint {

                bottom: 25px;

                font-size: 10px;

            }
        }
    </style>
</head>


<body>

    <div class="background"></div>


    <div class="container">

        <div
            class="heart-wrapper"
            id="heartWrapper"
        >

            <!--
                SVG HEART
            -->

            <svg
                class="heart"
                viewBox="0 0 300 300"
            >

                <!-- glow -->
                <path
                    class="heart-glow"
                    d="
                        M150 245

                        C135 230 55 180 55 115

                        C55 75 82 55 112 55

                        C132 55 145 68 150 82

                        C155 68 168 55 188 55

                        C218 55 245 75 245 115

                        C245 180 165 230 150 245
                    "
                />


                <!-- heart outline -->
                <path
                    class="heart-path"
                    d="
                        M150 245

                        C135 230 55 180 55 115

                        C55 75 82 55 112 55

                        C132 55 145 68 150 82

                        C155 68 168 55 188 55

                        C218 55 245 75 245 115

                        C245 180 165 230 150 245

                        Z
                    "
                />

            </svg>


            <!-- NAME -->

            <div class="name">
                Hân
            </div>

        </div>

    </div>


    <div
        class="hint"
        id="hint"
    >
        chạm vào đây
    </div>


    <script>

        const heart =
            document.getElementById(
                "heartWrapper"
            );

        const hint =
            document.getElementById(
                "hint"
            );


        /*
        =========================
        CREATE PARTICLES
        =========================
        */

        function createParticles() {

            const rect =
                heart.getBoundingClientRect();

            const centerX =
                rect.left +
                rect.width / 2;

            const centerY =
                rect.top +
                rect.height / 2;


            /*
            Tạo 45 hạt
            */

            for (
                let i = 0;
                i < 45;
                i++
            ) {

                const particle =
                    document.createElement(
                        "div"
                    );

                particle.className =
                    "particle";


                /*
                Vị trí ban đầu
                */

                particle.style.left =
                    centerX + "px";

                particle.style.top =
                    centerY + "px";


                /*
                Hướng bay random
                */

                const angle =
                    Math.random() *
                    Math.PI * 2;

                const distance =
                    80 +
                    Math.random() * 180;


                const x =
                    Math.cos(angle) *
                    distance;

                const y =
                    Math.sin(angle) *
                    distance;


                particle.style.setProperty(
                    "--x",
                    x + "px"
                );

                particle.style.setProperty(
                    "--y",
                    y + "px"
                );


                /*
                tốc độ random
                */

                particle.style.setProperty(
                    "--duration",
                    (
                        0.8 +
                        Math.random() * 0.8
                    ) + "s"
                );


                /*
                kích thước random
                */

                const size =
                    2 +
                    Math.random() * 4;

                particle.style.width =
                    size + "px";

                particle.style.height =
                    size + "px";


                document.body.appendChild(
                    particle
                );


                /*
                Xóa sau animation
                */

                setTimeout(
                    () => {
                        particle.remove();
                    },
                    1800
                );
            }
        }


        /*
        =========================
        FLASH
        =========================
        */

        function createFlash() {

            const flash =
                document.createElement(
                    "div"
                );

            flash.className =
                "flash";

            document.body.appendChild(
                flash
            );

            setTimeout(
                () => {
                    flash.remove();
                },
                900
            );
        }


        /*
        =========================
        CLICK
        =========================
        */

        let clicked = false;

        heart.addEventListener(
            "click",
            () => {

                createParticles();

                createFlash();


                /*
                Ẩn hint
                */

                if (!clicked) {

                    hint.classList.add(
                        "hide"
                    );

                    clicked = true;
                }


                /*
                Tim phóng nhẹ
                */

                heart.style.transform =
                    "scale(1.08)";


                setTimeout(
                    () => {

                        heart.style.transform =
                            "scale(1)";

                    },
                    250
                );

            }
        );


        /*
        =========================
        TOUCH
        =========================
        */

        heart.addEventListener(
            "touchstart",
            () => {

                heart.style.transform =
                    "scale(1.06)";

            }
        );

        heart.addEventListener(
            "touchend",
            () => {

                heart.style.transform =
                    "scale(1)";

            }
        );

    </script>

</body>
</html>
